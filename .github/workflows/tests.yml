name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Actions 的 Windows runner 默认 cp1252，测试里的中文 print 会直接抛 UnicodeEncodeError
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # 静态检查：能藏 bug 的规则（未使用导入/未定义名字/可疑异常处理）；
      # 不做全库格式化，避免一次重排上千行掩盖真实改动。
      - name: Ruff
        run: python -m ruff check bom-site skills/taobao-search/scripts

      # 类型检查是渐进式的：只覆盖边界清晰的新模块（见 bom-site/mypy.ini）。
      - name: Mypy (core modules)
        working-directory: bom-site
        run: python -m mypy

      # 一条命令跑全部纯 Python 套件（自己发现 test_*.py，新增脚本不用改 CI）。
      # runtests.py 会把子进程输出固定成 UTF-8，本地 cmd/PowerShell 也不再误报。
      - name: Unit, rule & integration tests
        working-directory: bom-site
        run: python runtests.py

      # Windows 启动器：语法解析 + 只读体检（不启动服务/浏览器）
      - name: Launcher smoke
        shell: pwsh
        working-directory: bom-site
        run: |
          $ps1 = (Resolve-Path launcher.ps1).Path
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile($ps1, [ref]$null, [ref]$errs) | Out-Null
          if ($errs.Count -gt 0) {
            $errs | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          pwsh -NoProfile -File $ps1 help -NoPause
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File $ps1 diag -NoPause
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
