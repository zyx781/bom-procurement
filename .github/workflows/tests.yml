name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Actions 的 Windows runner 默认 cp1252，测试里的中文 print 会直接抛 UnicodeEncodeError
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 纯 Python 套件：不需要浏览器，也不联网
      - name: Unit & rule tests
        working-directory: bom-site
        run: |
          python test_engine.py
          python test_lcsc.py
          python test_sku_selection.py
          python test_runner.py
          python test_verification_recovery.py
          python test_window_focus.py
          python test_click_guard.py
          python test_cart_cleanup.py
          python test_batch_progress_guard.py
          python test_procurement_guard.py
          python test_bom_regression.py
          python test_candidate_replay.py
          python test_sku_replay.py
          python test_screenshot_retention.py
          python test_single_run.py
          python test_line_update.py

      # 端到端：起假会话 + 临时 server 进程，验证调度闭环与 HTTP 路由
      - name: Integration (fake session)
        working-directory: bom-site
        run: python test_integration.py

      # Windows 启动器：语法解析 + 只读体检（不启动服务/浏览器）
      - name: Launcher smoke
        shell: pwsh
        working-directory: bom-site
        run: |
          $ps1 = (Resolve-Path launcher.ps1).Path
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile($ps1, [ref]$null, [ref]$errs) | Out-Null
          if ($errs.Count -gt 0) {
            $errs | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          pwsh -NoProfile -File $ps1 help -NoPause
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File $ps1 diag -NoPause
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
