# mypy 配置：渐进式启用，只查「新写的、边界清晰的」模块。
#
# 为什么不一把查全库：engine.py / taobao_runner.py 是几千行的历史代码，
# 到处是 `dict` 形状的中间结果，一次性开严格模式会报出几百条噪音，
# 结果是没人看、门禁被绕过。这里先把**错误边界**和**数据契约**钉住：
# 新增模块必须类型干净，老模块等拆分时逐个纳入。
[mypy]
python_version = 3.10
files = lcsc.py, errors.py, diagnostics.py, diag.py, bom_params.py, runtests.py
ignore_missing_imports = True
check_untyped_defs = True
no_implicit_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_return_any = True
show_error_codes = True

# diag.py 只在函数里延迟 import taobao_runner（诊断页不能拖慢服务启动）。
# 不跳过的话，mypy 会顺带把几千行历史代码全部纳入检查，报出上百条与本次
# 改动无关的噪音 —— 那正是这个配置一开始要避免的事。
[mypy-taobao_runner]
follow_imports = skip

[mypy-engine]
follow_imports = skip
